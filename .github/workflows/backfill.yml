name: backfill

# 一次性補歷史資料並跑回測；push 這兩支程式或手動觸發時執行
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/backfill.py", "scripts/backtest.py"]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 補歷史資料
        run: python scripts/backfill.py
        env:
          BACKFILL_MINUTES: "160"
      - name: 回測
        if: always()
        run: python scripts/backtest.py
      - name: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "backfill/backtest: $(TZ=Asia/Taipei date +%F)"
          git pull --rebase
          git push
