name: backfill

# 一次性補歷史資料並跑回測
# 只手動觸發（push 會觸發 update，同一個排隊群組只能留一個等待中的工作，避免互相取消）
# 一次跑不完（每次最多約 160 分鐘）：補完一輪 → 觸發每日更新（網站保持最新）→ 更新結束再接著補，直到補完或卡住
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 補歷史資料
        run: python scripts/backfill.py
        env:
          BACKFILL_MINUTES: "160"
      - name: 回測
        if: always()
        run: python scripts/backtest.py
      - name: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "backfill/backtest: $(TZ=Asia/Taipei date +%F)"
          git pull --rebase -X theirs
          git push
      - name: 交給每日更新（更新網站後會再接著補下一輪）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q "2018-01-02" data/hist/backfill_done.json 2>/dev/null; then
            echo "歷史資料已補完"
          fi
          gh workflow run update.yml --ref main
