<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台股評分看板</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="viz-root">
  <header>
    <div>
      <h1>台股評分看板</h1>
      <p class="sub" id="meta">載入中…</p>
    </div>
    <button id="themeBtn" class="ghost" title="切換深淺色">◐</button>
  </header>

  <nav class="tabs">
    <button data-tab="win" class="on">贏勢股</button>
    <button data-tab="value">價值股</button>
    <button data-tab="all">全部 / 搜尋</button>
    <button data-tab="how">分數怎麼算</button>
  </nav>

  <section class="filters" id="filters">
    <input id="q" type="search" placeholder="代號或名稱，例如 2330、台積">
    <select id="ind"><option value="">全部產業</option></select>
    <label class="minlbl">總分 ≥ <input id="min" type="number" value="0" min="0" max="100" step="5"></label>
    <span class="count" id="count"></span>
  </section>

  <main>
    <div id="tableWrap"></div>
    <div id="how" hidden></div>
  </main>

  <aside id="detail" hidden></aside>

  <footer>
    資料來源：臺灣證券交易所（收盤行情、三大法人、本益比/殖利率、月營收、財報 OpenAPI）。目前僅含上市股票。<br>
    本頁分數只是把公開數字做排名整理，<b>不是投資建議</b>，也不代表未來會漲。
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
